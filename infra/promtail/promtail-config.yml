server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: driftsentinel
    static_configs:
      - targets: [localhost]
        labels:
          job: driftsentinel
          __path__: /var/log/driftsentinel/*.log
    pipeline_stages:
      - json:
          expressions:
            kind: kind
            probe: probe
            ts: ts
      - labels:
          kind:
          probe:
      - timestamp:
          source: ts
          format: RFC3339Nano
