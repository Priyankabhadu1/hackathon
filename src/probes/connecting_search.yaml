name: connecting_search
workflow: flight_search
type: api
risk: medium
tool: flight-offers-search
params:
  originLocationCode: BLR
  destinationLocationCode: JFK
  departureDate: "2026-11-12"
  adults: 1
  currencyCode: EUR
  max: 5
plausible_total:          # EUR, one-way BLR-JFK economy
  min: 200
  max: 6000
assertions:
  - offers_present
  - every_offer_has_total_price
  - currency_is_iso4217
  - price_components_sum
  - itinerary_segments_present
  - price_within_plausible_range
